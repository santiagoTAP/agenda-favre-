<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Agenda Inmobiliaria Favre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e60000; --red-dk:#c20000; --red-soft:#ffe5e5;
  --ink:#0a0a0a; --ink2:#222; --paper:#ffffff; --paper2:#f5f5f6; --paper3:#ededee;
  --line:#e2e2e4; --line2:#d4d4d6; --txt:#0a0a0a; --muted:#6e6e73; --faint:#a0a0a5;
  --reunion:#2563c9; --venta:#1f9d57; --alquilar:#d97706; --tasacion:#8b3fc9; --turno:#c2185b; --otro:#6e6e73;
  --ok:#1f9d57; --err:#e60000;
  --r:14px; --sh:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper2);color:var(--txt);font-family:'Archivo',sans-serif;overscroll-behavior:none}
body{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:88px}

header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:14px 18px 12px}
.logo{width:42px;height:42px;flex-shrink:0;background:var(--red);border-radius:9px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(230,0,0,.3)}
.logo svg{width:24px;height:24px}
.brand-txt h1{font-weight:800;font-size:19px;letter-spacing:-.4px;line-height:1;color:var(--ink)}
.brand-txt .sub{font-family:'Archivo Narrow';font-weight:600;font-size:11px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--red);margin-top:3px}
.h-meta{display:flex;align-items:center;justify-content:space-between;padding:0 18px 12px}
.count{font-size:13px;color:var(--muted);font-weight:600}.count b{color:var(--ink)}
.status-pill{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:700;letter-spacing:.5px;
  background:var(--paper3);color:var(--muted);display:flex;align-items:center;gap:5px;text-transform:uppercase}
.status-pill .led{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.status-pill.demo .led{background:var(--alquilar)}
.status-pill.live{background:#e7f6ee;color:var(--ok)}.status-pill.live .led{background:var(--ok)}

/* search + filtros */
.search-wrap{padding:0 18px 12px;position:relative}
.search{width:100%;border:1.5px solid var(--line2);border-radius:11px;padding:11px 14px 11px 38px;
  font-family:'Archivo';font-size:14px;color:var(--ink);background:var(--paper2);outline:none;transition:.15s}
.search:focus{border-color:var(--red);background:var(--paper)}
.search-wrap svg{position:absolute;left:30px;top:11px;color:var(--faint)}
.search-clear{position:absolute;right:30px;top:8px;width:24px;height:24px;border:none;border-radius:50%;
  background:var(--paper3);color:var(--muted);font-size:14px;cursor:pointer;display:none}
.search-clear.show{display:block}

.filter-bar{display:flex;align-items:center;gap:8px;padding:0 18px 12px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  padding:8px 14px;border-radius:30px;background:var(--paper);border:1.5px solid var(--line2);
  color:var(--ink2);cursor:pointer;transition:.16s;white-space:nowrap}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fbtn .badge{background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fbtn.on .badge{background:#fff;color:var(--ink)}
.fbtn svg{transition:.2s}
.fbtn.open svg.chev{transform:rotate(180deg)}
.clear-all{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--red);background:none;border:none;
  cursor:pointer;padding:8px 6px;text-decoration:underline;display:none}
.clear-all.show{display:block}

/* panel desplegable */
.panel{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--paper2);border-bottom:1px solid var(--line)}
.panel.open{max-height:520px}
.panel-inner{padding:14px 18px}
.panel-sec{margin-bottom:16px}
.panel-sec:last-child{margin-bottom:4px}
.panel-sec h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:9px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{font-size:13px;font-weight:600;padding:7px 13px;border-radius:30px;background:var(--paper);
  border:1.5px solid var(--line2);color:var(--ink2);cursor:pointer;transition:.15s}
.opt.sel{background:var(--red);color:#fff;border-color:var(--red)}
.opt.obj-reunion.sel{background:var(--reunion);border-color:var(--reunion)}
.opt.obj-venta.sel{background:var(--venta);border-color:var(--venta)}
.opt.obj-alquilar.sel{background:var(--alquilar);border-color:var(--alquilar)}
.opt.obj-tasacion.sel{background:var(--tasacion);border-color:var(--tasacion)}
.opt.obj-turno.sel{background:var(--turno);border-color:var(--turno)}
.dateinput{border:1.5px solid var(--line2);border-radius:9px;padding:8px 11px;font-family:'Archivo';font-size:13px;color:var(--ink);background:var(--paper);outline:none}
.dateinput:focus{border-color:var(--red)}

main{padding:16px 14px}
.day-group{margin-bottom:24px}
.day-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;padding:0 4px}
.day-label{font-size:13px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.5px}
.day-label.is-today{color:var(--red)}
.day-line{flex:1;height:2px;background:var(--line);border-radius:2px}
.day-count{font-size:11px;color:#fff;font-weight:700;background:var(--ink);min-width:20px;height:20px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:11px;position:relative;overflow:hidden;box-shadow:var(--sh);
  animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--otro)}
.card.t-reunion::before{background:var(--reunion)}.card.t-venta::before{background:var(--venta)}
.card.t-alquilar::before{background:var(--alquilar)}.card.t-tasacion::before{background:var(--tasacion)}
.card.t-turno::before{background:var(--turno)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:9px}
.c-time{font-size:23px;font-weight:900;line-height:1;letter-spacing:-1px;color:var(--ink)}
.c-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:5px 9px;border-radius:7px;color:#fff}
.c-tag.reunion{background:var(--reunion)}.c-tag.venta{background:var(--venta)}
.c-tag.alquilar{background:var(--alquilar)}.c-tag.tasacion{background:var(--tasacion)}
.c-tag.turno{background:var(--turno)}.c-tag.otro{background:var(--otro)}
.c-title{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:10px;color:var(--ink)}
.c-meta{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.c-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.c-row svg{flex-shrink:0;color:var(--faint)}.c-row b{color:var(--ink2);font-weight:600}
.c-actions{display:flex;gap:8px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;
  font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--line2);background:var(--paper);
  color:var(--ink2);text-decoration:none;transition:.15s}
.act svg{width:15px;height:15px}.act:active{transform:scale(.96)}
.act.wa{background:#e7f6ee;color:var(--ok);border-color:#bfe6cf}
.act.map{background:var(--red-soft);color:var(--red-dk);border-color:#ffc9c9}
.act.disabled{opacity:.4;pointer-events:none}
.person-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.pb{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--paper3);color:var(--ink2)}
.c-foot{font-size:11px;color:var(--faint);margin-top:9px;font-weight:500}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{color:var(--line2);margin-bottom:14px}
.loader{text-align:center;padding:50px 20px;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:0 auto 14px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fab-refresh{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:30;background:var(--red);
  color:#fff;border:none;padding:14px 26px;border-radius:30px;font-family:'Archivo';font-size:14px;font-weight:800;
  cursor:pointer;box-shadow:0 6px 22px rgba(230,0,0,.4);display:flex;align-items:center;gap:8px;transition:.15s}
.fab-refresh:active{transform:translateX(-50%) scale(.95)}.fab-refresh.loading svg{animation:sp .7s linear infinite}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;z-index:40;opacity:0;transition:.3s;
  box-shadow:var(--sh);pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:var(--red)}

/* ---- Pestañas Lista / Calendario ---- */
.tabs{display:flex;gap:0;padding:0 18px;margin-top:2px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;font-size:14px;
  font-weight:700;color:var(--muted);background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;transition:.16s}
.tab svg{width:16px;height:16px}
.tab.on{color:var(--red);border-bottom-color:var(--red)}

/* ---- Vista calendario estilo Notion ---- */
.cal-wrap{padding:14px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 6px}
.cal-month{font-size:18px;font-weight:800;color:var(--ink);text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line2);background:var(--paper);
  color:var(--ink2);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.cal-nav button:active{transform:scale(.92);background:var(--paper3)}
.cal-nav .hoy{font-size:12px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  padding:7px 0;background:var(--paper2)}
.cal-cell{background:var(--paper);min-height:74px;padding:4px 4px 5px;cursor:pointer;position:relative;transition:.12s;display:flex;flex-direction:column;gap:2px}
.cal-cell.empty{background:var(--paper2);cursor:default}
.cal-cell:not(.empty):active{background:var(--paper2)}
.cal-cell .num{font-size:12px;font-weight:700;color:var(--ink2);width:21px;height:21px;display:flex;align-items:center;justify-content:center;border-radius:50%;align-self:flex-start}
.cal-cell.today .num{background:var(--red);color:#fff}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-evs{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-ev.reunion{border-left-color:var(--reunion);background:#eef4fd;color:#1a4a9c}
.cal-ev.venta{border-left-color:var(--venta);background:#e9f7ef;color:#15784a}
.cal-ev.alquilar{border-left-color:var(--alquilar);background:#fdf2e3;color:#9a5a06}
.cal-ev.tasacion{border-left-color:var(--tasacion);background:#f5ecfc;color:#6a2a9c}
.cal-ev.turno{border-left-color:var(--turno);background:#fcecf2;color:#9c1248}
.cal-ev .h{font-weight:800;margin-right:3px}
.cal-more{font-size:9px;font-weight:700;color:var(--muted);padding:0 4px}

.cal-day-detail{margin-top:22px;padding:0 4px}
.cal-day-title{font-size:14px;font-weight:800;color:var(--ink);text-transform:capitalize;margin-bottom:12px;
  display:flex;align-items:center;gap:8px}
.cal-day-title .badge-n{background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.cal-day-title .add-day{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  color:#fff;background:var(--red);border:none;padding:7px 12px;border-radius:9px;cursor:pointer;transition:.15s}
.cal-day-title .add-day:active{transform:scale(.95)}
.cal-day-title .add-day svg{width:14px;height:14px}
.cal-empty-day{text-align:center;padding:24px 20px;color:var(--muted);font-size:14px}
.hidden{display:none!important}

/* ---- Modal formulario nueva cita ---- */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(2px)}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1);padding:8px 18px 24px}
.modal-bg.show .modal{transform:translateY(0)}
.modal-grip{width:40px;height:4px;background:var(--line2);border-radius:3px;margin:8px auto 14px}
.modal h3{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
.modal .msub{font-size:13px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field label .opt{color:var(--faint);font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:11px 12px;
  font-family:'Archivo';font-size:14px;color:var(--ink);background:var(--paper);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.obj-pick{display:flex;flex-wrap:wrap;gap:7px}
.obj-pick .op{font-size:13px;font-weight:600;padding:8px 13px;border-radius:30px;background:var(--paper);
  border:1.5px solid var(--line2);color:var(--ink2);cursor:pointer;transition:.15s}
.obj-pick .op.sel{background:var(--red);color:#fff;border-color:var(--red)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;padding:13px;border-radius:11px;font-family:'Archivo';font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.btn-cancel{background:var(--paper3);border:none;color:var(--ink2)}
.btn-save{background:var(--red);border:none;color:#fff}
.btn-save:disabled{opacity:.5;pointer-events:none}
.btn-save.sending{pointer-events:none}
.btn-save.sending::after{content:"";display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;margin-left:8px;vertical-align:-2px;animation:sp .7s linear infinite}
.modal-actions button:active{transform:scale(.97)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3h14v4H10v3h7v4h-7v7H5V3z" fill="#fff"/></svg></div>
    <div class="brand-txt"><h1>Agenda Favre</h1><div class="sub">Inmobiliaria</div></div>
  </div>
  <div class="h-meta">
    <div class="count" id="subCount">Cargando…</div>
    <div class="status-pill demo" id="statusPill"><span class="led"></span><span id="statusTxt">Demo</span></div>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
    <input class="search" id="search" placeholder="Buscar contacto, evento, dirección…" oninput="onSearch(this.value)">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
  </div>
  <div class="filter-bar">
    <button class="fbtn" id="tgPersona" onclick="togglePanel('persona')">Persona <span class="badge" id="bPersona" style="display:none">0</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgObjetivo" onclick="togglePanel('objetivo')">Objetivo <span class="badge" id="bObjetivo" style="display:none">0</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgFranja" onclick="togglePanel('franja')">Horario <span class="badge" id="bFranja" style="display:none">0</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgFecha" onclick="togglePanel('fecha')">Día <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgOrden" onclick="togglePanel('orden')">Orden <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="clear-all" id="clearAll" onclick="clearAll()">Limpiar</button>
  </div>
  <div class="panel" id="panel"><div class="panel-inner" id="panelInner"></div></div>
  <div class="tabs">
    <button class="tab on" id="tabLista" onclick="setVista('lista')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Lista
    </button>
    <button class="tab" id="tabCal" onclick="setVista('calendario')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Calendario
    </button>
  </div>
</header>

<main id="main"><div class="loader"><div class="spin"></div><p>Cargando agenda…</p></div></main>
<div id="calView" class="cal-wrap hidden"></div>

<button class="fab-refresh" id="refreshBtn" onclick="cargar()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg> Actualizar
</button>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <div class="modal-grip"></div>
    <h3>Nueva cita</h3>
    <div class="msub" id="modalFecha"></div>
    <div class="field">
      <label>Evento / título</label>
      <input id="fEvento" placeholder="Ej: 10.00HS visita con Juan Pérez">
    </div>
    <div class="field-row">
      <div class="field"><label>Fecha</label><input type="date" id="fFecha"></div>
      <div class="field"><label>Hora</label><input type="time" id="fHora"></div>
    </div>
    <div class="field">
      <label>Objetivo</label>
      <div class="obj-pick" id="fObjetivo"></div>
    </div>
    <div class="field"><label>Persona <span class="opt">(quién atiende)</span></label><input id="fPersona" placeholder="Ej: Santiago Favre"></div>
    <div class="field">
      <label>Contacto <span class="opt">(cliente)</span></label>
      <input id="fContacto" list="listaContactos" placeholder="Nombre del cliente o selecciona...">
      <datalist id="listaContactos"></datalist>
    </div>

    <div class="field"><label>Ubicación <span class="opt">(opcional)</span></label><input id="fUbicacion" placeholder="Dirección"></div>

      <button class="btn-save" id="btnSave" onclick="enviarCita()">Guardar cita</button>
    </div>
  </div>
</div>

<script>
const WEBHOOK_URL = "https://hook.us1.make.com/q67odesdv4mkrftpc7kwjdlfmku6wjem";
const API_TOKEN   = "TestFavre-0506";
const WEBHOOK_CREAR = "https://hook.us1.make.com/ttal396rhyg6qcjpsmqcwybk8su5o6qs";

const OBJ_MAP={'Reunion':'reunion','Venta':'venta','Alquilar':'alquilar','Tasacion':'tasacion','Turno':'turno'};
const FRANJAS={'manana':{label:'Mañana · 7 a 12',min:7,max:12},'mediodia':{label:'Mediodía · 12 a 15',min:12,max:15},'tarde':{label:'Tarde · 15 en adelante',min:15,max:24}};

const DEMO = [];

let DATA=[];
let CONTACTOS=[]; 
let F={persona:new Set(),objetivo:new Set(),franja:new Set(),dia:'',texto:'',orden:'fecha-asc'};
let panelAbierto=null;

const $=s=>document.querySelector(s);
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2800);}

function fmtTime(iso){const d=new Date(iso);if(isNaN(d))return'--';return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function dayKey(iso){const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayLabel(iso){const d=new Date(iso);const hoy=new Date();const ma=new Date();ma.setDate(hoy.getDate()+1);
  if(dayKey(iso)===dayKey(hoy))return'Hoy';if(dayKey(iso)===dayKey(ma))return'Mañana';
  return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});}
function isToday(iso){return dayKey(iso)===dayKey(new Date());}
function fmtCrea(iso){if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}

function personas(){const s=new Set();DATA.forEach(d=>(d.persona||'').split(',').forEach(p=>{p=p.trim();if(p)s.add(p);}));return[...s].sort();}
function objetivos(){const s=new Set();DATA.forEach(d=>{if(d.objetivo)s.add(d.objetivo);});return[...s].sort();}

function mapURL(d){
  if(d.lat&&d.lng) return 'https://www.google.com/maps/search/?api=1&query=' + d.lat + ',' + d.lng;
  return d.ubicacion?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.ubicacion):'';
}

/* -------- PANEL DE FILTROS -------- */
function togglePanel(tipo){
  if(panelAbierto===tipo){cerrarPanel();return;}
  panelAbierto=tipo;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('open'));
  $('#tg'+cap(tipo)).classList.add('open');
  $('#panel').classList.add('open');
  $('#panelInner').innerHTML=panelHTML(tipo);
}
function cerrarPanel(){panelAbierto=null;$('#panel').classList.remove('open');document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('open'));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function panelHTML(tipo){
  if(tipo==='persona'){
    return sec('Filtrar por persona',personas().map(p=>opt(p,F.persona.has(p),`toggleSet('persona','${esc(p).replace(/'/g,"\\'")}')`)).join(''));
  }
  if(tipo==='objetivo'){
    return sec('Filtrar por objetivo',objetivos().map(o=>opt(o,F.objetivo.has(o),`toggleSet('objetivo','${esc(o)}')`,'obj-'+(OBJ_MAP[o]||'otro'))).join(''));
  }
  if(tipo==='franja'){
    return sec('Franja horaria',Object.keys(FRANJAS).map(k=>opt(FRANANJAS[k].label,F.franja.has(k),`toggleSet('franja','${k}')`)).join(''));
  }
  if(tipo==='fecha'){
    return sec('Día de la cita',
      `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="date" class="dateinput" id="diaInput" value="${F.dia}" onchange="setDia(this.value)">
        ${F.dia?`<button class="opt sel" onclick="setDia('')">Quitar ✕</button>`:''}
      </div>`);
  }
  if(tipo==='orden'){
    const ords=[['fecha-asc','Cita: más próxima primero'],['fecha-desc','Cita: más lejana primero'],['crea-desc','Creación: más reciente'],['crea-asc','Creación: más antigua'],['contacto','Contacto (A-Z)']];
    return sec('Ordenar por',ords.map(([v,l])=>opt(l,F.orden===v,`setOrden('${v}')`)).join(''));
  }
  return'';
}
function sec(title,inner){return`<div class="panel-sec"><h4>${title}</h4><div class="opts">${inner}</div></div>`;}
function opt(label,sel,onclick,extra){return`<button class="opt ${extra||''} ${sel?'sel':''}" onclick="${onclick}">${label}</button>`;}

function toggleSet(grupo,val){F[grupo].has(val)?F[grupo].delete(val):F[grupo].add(val);refreshUI();$('#panelInner').innerHTML=panelHTML(panelAbierto);}
function setDia(v){F.dia=v;refreshUI();if(panelAbierto==='fecha')$('#panelInner').innerHTML=panelHTML('fecha');}
function setOrden(v){F.orden=v;refreshUI();$('#panelInner').innerHTML=panelHTML('orden');}
function onSearch(v){F.texto=v.toLowerCase().trim();$('#searchClear').className='search-clear'+(v?' show':'');refreshUI();}
function clearSearch(){$('#search').value='';F.texto='';$('#searchClear').className='search-clear';refreshUI();}
function clearAll(){F={persona:new Set(),objetivo:new Set(),franja:new Set(),dia:'',texto:'',orden:'fecha-asc'};$('#search').value='';$('#searchClear').className='search-clear';cerrarPanel();refreshUI();}

function refreshUI(){
  badge('Persona',F.persona.size);badge('Objetivo',F.objetivo.size);badge('Franja',F.franja.size);
  setOn('tgPersona',F.persona.size);setOn('tgObjetivo',F.objetivo.size);setOn('tgFranja',F.franja.size);
  setOn('tgFecha',F.dia);setOn('tgOrden',F.orden!=='fecha-asc');
  const activo=F.persona.size||F.objetivo.size||F.franja.size||F.dia||F.texto||F.orden!=='fecha-asc';
  $('#clearAll').className='clear-all'+(activo?' show':'');
  if(vista==='calendario')renderCalendario();else render();
}
function badge(name,n){const b=$('#b'+name);if(n>0){b.textContent=n;b.style.display='flex';}else b.style.display='none';}
function setOn(id,cond){$('#'+id).classList.toggle('on',!!cond);}

/* -------- APLICAR FILTROS -------- */
function filtrar(){
  return DATA.filter(d=>{
    if(!d.fecha)return false;
    if(F.persona.size && ![...F.persona].some(p=>(d.persona||'').includes(p)))return false;
    if(F.objetivo.size && !F.objetivo.has(d.objetivo))return false;
    if(F.dia && dayKey(d.fecha)!==F.dia)return false;
    if(F.franja.size){const h=new Date(d.fecha).getHours();
      if(![...F.franja].some(k=>h>=FRANJAS[k].min && h<FRANJAS[k].max))return false;}
    if(F.texto){const blob=(d.evento+' '+d.contacto+' '+d.ubicacion+' '+d.persona+' '+d.objetivo).toLowerCase();
      if(!blob.includes(F.texto))return false;}
    return true;
  });
}
function ordenar(items){
  const c=[...items];
  switch(F.orden){
    case'fecha-desc':c.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));break;
    case'crea-desc':c.sort((a,b)=>new Date(b.creacion_iso||0)-new Date(a.creacion_iso||0));break;
    case'crea-asc':c.sort((a,b)=>new Date(a.creacion_iso||0)-new Date(b.creacion_iso||0));break;
    case'contacto':c.sort((a,b)=>(a.contacto||'').localeCompare(b.contacto||''));break;
    default:c.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  }
  return c;
}

function iconLoc(){return'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';}
function iconUser(){return'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';}
function iconWa(){return'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.2s-.7.9-.9 1.1c-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5 4.5.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15l-1.3 4.7L7 20.4A10 10 0 1 0 12 2z"/></svg>';}
function iconMap(){return iconLoc();}

/* -------- VISTAS: lista / calendario -------- */
let vista='lista';
let calRef=new Date();
let calSel=dayKey(new Date());

function setVista(v){
  vista=v;
  $('#tabLista').classList.toggle('on',v==='lista');
  $('#tabCal').classList.toggle('on',v==='calendario');
  $('#main').classList.toggle('hidden',v!=='lista');
  $('#calView').classList.toggle('hidden',v!=='calendario');
  if(v==='calendario'){irMesConCitas();renderCalendario();}else render();
}

function irMesConCitas(){
  const map=citasPorDia();
  const claves=Object.keys(map);
  if(!claves.length)return;
  const mesActual=calRef.getFullYear()+'-'+String(calRef.getMonth()+1).padStart(2,'0');
  const hayEsteMes=claves.some(k=>k.startsWith(mesActual));
  if(hayEsteMes)return;
  const hoy=new Date();
  const fechas=claves.map(k=>new Date(k+'T12:00:00')).sort((a,b)=>Math.abs(a-hoy)-Math.abs(b-hoy));
  const target=fechas[0];
  calRef=new Date(target.getFullYear(),target.getMonth(),1);
  calSel=dayKey(target);
}

function citasPorDia(){
  const map={};
  DATA.filter(d=>{
    if(!d.fecha)return false;
    if(F.persona.size && ![...F.persona].some(p=>(d.persona||'').includes(p)))return false;
    if(F.objetivo.size && !F.objetivo.has(d.objetivo))return false;
    if(F.franja.size){const h=new Date(d.fecha).getHours();
      if(![...F.franja].some(k=>h>=FRANJAS[k].min && h<FRANJAS[k].max))return false;}
    if(F.texto){const blob=(d.evento+' '+d.contacto+' '+d.ubicacion+' '+d.persona+' '+d.objetivo).toLowerCase();
      if(!blob.includes(F.texto))return false;}
    return true;
  }).forEach(d=>{const k=dayKey(d.fecha);(map[k]=map[k]||[]).push(d);});
  return map;
}

function calMes(delta){calRef.setMonth(calRef.getMonth()+delta);renderCalendario();}

function renderCalendario(){
  const cont=$('#calView');
  const map=citasPorDia();
  const total=Object.values(map).reduce((a,b)=>a+b.length,0);
  $('#subCount').innerHTML=`<b>${total}</b> cita${total!==1?'s':''}`;

  const y=calRef.getFullYear(),m=calRef.getMonth();
  const primero=new Date(y,m,1);
  const inicioSemana=(primero.getDay()+6)%7;
  const diasMes=new Date(y,m+1,0).getDate();
  const hoyK=dayKey(new Date());
  const mesNombre=calRef.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const dows=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  let html=`<div class="cal-head">
    <div class="cal-month">${mesNombre}</div>
    <div class="cal-nav"><button onclick="calMes(-1)">‹</button><button class="hoy" onclick="irHoy()">Hoy</button><button onclick="calMes(1)">›</button></div>
  </div><div class="cal-grid">`;
  dows.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<inicioSemana;i++)html+='<div class="cal-cell empty"></div>';
  for(let dia=1;dia<=diasMes;dia++){
    const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dia).padStart(2,'0');
    const citas=(map[k]||[]).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
    const cls=['cal-cell'];
    if(k===hoyK)cls.push('today');
    if(k===calSel)cls.push('sel');
    let evs='';
    const visibles=citas.slice(0,2);
    visibles.forEach(c=>{
      const t=OBJ_MAP[c.objetivo]||'otro';
      const titulo=esc((c.contacto||c.evento||'').slice(0,22));
      evs+=`<div class="cal-ev ${t}"><span class="h">${fmtTime(c.fecha)}</span>${titulo}</div>`;
    });
    const resto=citas.length-visibles.length;
    html+=`<div class="${cls.join(' ')}" onclick="selDia('${k}')">
      <span class="num">${dia}</span>
      ${citas.length?`<div class="cal-evs">${evs}</div>${resto>0?`<span class="cal-more">+${resto} más</span>`:''}`:''}
    </div>`;
  }
  html+='</div>';
  html+=`<div class="cal-day-detail" id="calDetail"></div>`;
  cont.innerHTML=html;
  renderDetalleDia();
}

function selDia(k){calSel=k;renderCalendario();}
function irHoy(){calRef=new Date();calSel=dayKey(new Date());renderCalendario();}

function renderDetalleDia(){
  const det=$('#calDetail');if(!det)return;
  const map=citasPorDia();
  const citas=(map[calSel]||[]).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const fechaTxt=new Date(calSel+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  let html=`<div class="cal-day-title">${fechaTxt}${citas.length?`<span class="badge-n">${citas.length}</span>`:''}<button class="add-day" onclick="abrirModal('${calSel}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Agregar</button></div>`;
  if(!citas.length){html+='<div class="cal-empty-day">Sin citas este día</div>';}
  else{let delay=0;citas.forEach(d=>{html+=cardHTML(d,delay);delay+=30;});}
  det.innerHTML=html;
}

/* -------- MODAL NUEVA CITA -------- */
const OBJETIVOS_FORM=['Reunion','Venta','Alquilar','Tasacion','Turno','Recibir llaves'];
let objSel='Reunion';

function abrirModal(diaK){
  $('#fFecha').value=diaK||dayKey(new Date());
  $('#fHora').value='10:00';
  $('#fEvento').value='';$('#fPersona').value='';$('#fContacto').value='';$('#fTelefono').value='';$('#fUbicacion').value='';
  objSel='Reunion';
  $('#fObjetivo').innerHTML=OBJETIVOS_FORM.map(o=>`<span class="op ${o===objSel?'sel':''}" onclick="pickObj('${o}',this)">${o}</span>`).join('');
  const ft=new Date((diaK||dayKey(new Date()))+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  $('#modalFecha').textContent='Para el '+ft;
  $('#modalBg').classList.add('show');
}
function cerrarModal(){$('#modalBg').classList.remove('show');}
function pickObj(o,el){objSel=o;document.querySelectorAll('#fObjetivo .op').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}

function actualizarDatalistContactos(){
  const dl = $('#listaContactos');
  if(!dl) return;
  dl.innerHTML = CONTACTOS.map(c => {
    if(c && c.name) {
       return `<option value="${esc(c.name)}"></option>`;
    }
    return '';
  }).join('');
}

async function enviarCita(){
  const evento=$('#fEvento').value.trim();
  const fecha=$('#fFecha').value;
  const hora=$('#fHora').value||'00:00';
  const nombreContacto = $('#fContacto').value.trim();
  
  if(!evento){toast('Poné un título para la cita',true);return;}
  if(!fecha){toast('Elegí una fecha',true);return;}

  const matchContacto = CONTACTOS.find(c => c && c.name && c.name.toLowerCase() === nombreContacto.toLowerCase());
  const contactoId = matchContacto ? matchContacto.id : '';

  const payload={
    accion:'crear',
    token:API_TOKEN,
    evento:evento,
    fecha:fecha+'T'+hora+':00',
    objetivo:objSel,
    persona:$('#fPersona').value.trim(),
    contacto:nombreContacto,
    contacto_id:contactoId, 
    telefono:$('#fTelefono').value.trim(),
    ubicacion:$('#fUbicacion').value.trim()
  };

  const btn=$('#btnSave');btn.classList.add('sending');btn.textContent='Guardando';

  if(!WEBHOOK_CREAR){
    DATA.push({id:'local-'+Date.now(),evento:payload.evento,persona:payload.persona,fecha:payload.fecha,
      ubicacion:payload.ubicacion,lat:'',lng:'',objetivo:payload.objetivo,contacto:payload.contacto,
      telefono:payload.telefono,estado:'Vigente',creacion_iso:new Date().toISOString().slice(0,19),creado_por:''});
    btn.classList.remove('sending');btn.textContent='Guardar cita';
    cerrarModal();calSel=fecha;refreshUI();
    toast('Cita agregada (local — falta configurar webhook de alta)');
    return;
  }

  try{
    const res=await fetch(WEBHOOK_CREAR,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    cerrarModal();
    toast('Cita creada — actualizando agenda…');
    calSel=fecha;
    await cargar();
    setVista('calendario');
  }catch(e){
    toast('No se pudo crear la cita. Revisá el webhook.',true);
  }finally{
    btn.classList.remove('sending');btn.textContent='Guardar cita';
  }
}

function render(){
  const main=$('#main');
  let items=ordenar(filtrar());
  $('#subCount').innerHTML=`<b>${items.length}</b> cita${items.length!==1?'s':''}`;
  if(!items.length){main.innerHTML='<div class="empty"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><p>No hay citas con estos filtros</p></div>';return;}

  const ordenCronologico=(F.orden==='fecha-asc'||F.orden==='fecha-desc');
  let html='',delay=0;
  if(ordenCronologico){
    const groups={};items.forEach(d=>{const k=dayKey(d.fecha);(groups[k]=groups[k]||[]).push(d);});
    const keys=Object.keys(groups).sort((a,b)=>new Date(groups[a][0].fecha)-new Date(groups[b][0].fecha));
    if(F.orden==='fecha-desc')keys.reverse();
    keys.forEach(k=>{const arr=groups[k];
      html+=`<div class="day-group"><div class="day-head"><span class="day-label ${isToday(arr[0].fecha)?'is-today':''}">${dayLabel(arr[0].fecha)}</span><span class="day-line"></span><span class="day-count">${arr.length}</span></div>`;
      arr.forEach(d=>{html+=cardHTML(d,delay);delay+=30;});html+='</div>';});
  }else{
    html+='<div class="day-group">';items.forEach(d=>{html+=cardHTML(d,delay);delay+=30;});html+='</div>';
  }
  main.innerHTML=html;
}
function cardHTML(d,delay){
  const cls=OBJ_MAP[d.objetivo]||'otro';
  const tel=(d.telefono||'').replace(/\D/g,'');
  const waLink=tel?`https://wa.me/${tel.length<=10?'54'+tel:tel}`:'';
  const mLink=mapURL(d);
  const pers=(d.persona||'').split(',').map(p=>p.trim()).filter(Boolean);
  const showFecha=(F.orden==='crea-desc'||F.orden==='crea-asc'||F.orden==='contacto');
  return`<div class="card t-${cls}" style="animation-delay:${delay}ms">
    <div class="c-top"><div class="c-time">${fmtTime(d.fecha)}${showFecha?` <span style="font-size:12px;color:var(--muted);font-weight:600">· ${new Date(d.fecha).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</span>`:''}</div>
      ${d.objetivo?`<span class="c-tag ${cls}">${esc(d.objetivo)}</span>`:''}</div>
    <div class="c-title">${esc(d.evento)||'(sin título)'}</div>
    <div class="c-meta">
      ${d.contacto?`<div class="c-row">${iconUser()}<b>${esc(d.contacto)}</b></div>`:''}
      ${d.ubicacion?`<div class="c-row">${iconLoc()}<span>${esc(d.ubicacion)}</span></div>`:''}
      ${pers.length?`<div class="person-badges">${pers.map(p=>`<span class="pb">${esc(p)}</span>`).join('')}</div>`:''}
    </div>
    <div class="c-actions">
      <a class="act wa ${waLink?'':'disabled'}" ${waLink?`href="${waLink}" target="_blank" rel="noopener"`:''}>${iconWa()}WhatsApp</a>
      <a class="act map ${mLink?'':'disabled'}" ${mLink?`href="${mLink}" target="_blank" rel="noopener"`:''}>${iconMap()}Mapa</a>
    </div>
    ${d.creacion_iso?`<div class="c-foot">Creado ${d.creado_por?'por '+esc(d.creado_por)+' ':''}el ${fmtCrea(d.creacion_iso)}</div>`:''}
  </div>`;
}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));}

async function cargar(){
  const btn=$('#refreshBtn');btn.classList.add('loading');
  if(!WEBHOOK_URL){
    DATA=DEMO; CONTACTOS=[]; $('#statusPill').className='status-pill demo';$('#statusTxt').textContent='Demo';
    refreshUI();actualizarDatalistContactos();btn.classList.remove('loading');toast('Modo demo — pegá tu webhook de Make para datos reales');return;
  }
  try{
    const res=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'listar',token:API_TOKEN})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    
    let json=await res.json();
    console.log("Respuesta cruda recibida de Make:", json);
    
    // 1. Desempaquetar si Make responde con un array que contiene el objeto dentro [ {agenda, contactos} ]
    if(Array.isArray(json) && json.length > 0 && json[0].agenda){
      json = json[0];
    }
    
    // 2. Comprobar estructura esperada de propiedades agrupadas
    if(json && (json.agenda !== undefined || json.contactos !== undefined)){
      
      // Sanitizar por si Make los envía codificados como Strings de texto en lugar de JSON Arrays
      let agendaData = typeof json.agenda === 'string' ? JSON.parse(json.agenda) : json.agenda;
      let contactosData = typeof json.contactos === 'string' ? JSON.parse(json.contactos) : json.contactos;
      
      DATA = Array.isArray(agendaData) ? agendaData : [];
      CONTACTOS = Array.isArray(contactosData) ? contactosData : [];
      
    } else {
      // Fallback por si en algún momento devuelve solo el listado plano de agenda
      DATA = Array.isArray(json) ? json : (json.items || json.data || []);
      CONTACTOS = [];
    }
    
    $('#statusPill').className='status-pill live';$('#statusTxt').textContent='En vivo';
    refreshUI();
    actualizarDatalistContactos(); 
    toast('Agenda actualizada');
  }catch(e){
    console.error("Error detallado procesando la carga:", e);
    DATA=DEMO; CONTACTOS=[]; $('#statusPill').className='status-pill demo';$('#statusTxt').textContent='Demo';
    refreshUI();
    actualizarDatalistContactos();
    toast('Error en formato de datos del webhook',true);
  }finally{btn.classList.remove('loading');}
}
cargar();
</script>
</body>
</html>
