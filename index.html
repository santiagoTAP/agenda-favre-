<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Agenda Inmobiliaria Favre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3h14v4H10v3h7v4h-7v7H5V3z" fill="#fff"/></svg></div>
    <div class="brand-txt"><h1>Agenda Favre</h1><div class="sub">Inmobiliaria</div></div>
  </div>
  <div class="h-meta">
    <div class="count" id="subCount">Cargando…</div>
    <div class="status-pill demo" id="statusPill"><span class="led"></span><span id="statusTxt">Demo</span></div>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
    <input class="search" id="search" placeholder="Buscar contacto, evento, dirección…" oninput="onSearch(this.value)">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
  </div>
  <div class="filter-bar">
    <button class="fbtn" id="tgPersona" onclick="togglePanel('persona')">Persona <span class="badge" id="bPersona" style="display:none">0</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgObjetivo" onclick="togglePanel('objetivo')">Objetivo <span class="badge" id="bObjetivo" style="display:none">0</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgFranja" onclick="togglePanel('franja')">Horario <span class="badge" id="bFranja" style="display:none">0</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgFecha" onclick="togglePanel('fecha')">Día <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="fbtn" id="tgOrden" onclick="togglePanel('orden')">Orden <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="clear-all" id="clearAll" onclick="clearAll()">Limpiar</button>
  </div>
  <div class="panel" id="panel"><div class="panel-inner" id="panelInner"></div></div>
  <div class="tabs">
    <button class="tab on" id="tabLista" onclick="setVista('lista')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Lista
    </button>
    <button class="tab" id="tabCal" onclick="setVista('calendario')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Calendario
    </button>
  </div>
</header>

<main id="main"><div class="loader"><div class="spin"></div><p>Cargando agenda…</p></div></main>
<div id="calView" class="cal-wrap hidden"></div>

<button class="fab-refresh" id="refreshBtn" onclick="cargar()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg> Actualizar
</button>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <div class="modal-grip"></div>
    <h3>Nueva cita</h3>
    <div class="msub" id="modalFecha"></div>
    <div class="field">
      <label>Evento / título</label>
      <input id="fEvento" placeholder="Ej: 10.00HS visita con Juan Pérez">
    </div>
    <div class="field-row">
      <div class="field"><label>Fecha</label><input type="date" id="fFecha"></div>
      <div class="field"><label>Hora</label><input type="time" id="fHora"></div>
    </div>
    <div class="field">
      <label>Objetivo</label>
      <div class="obj-pick" id="fObjetivo"></div>
    </div>
    <div class="field"><label>Persona <span class="opt">(quién atiende)</span></label><input id="fPersona" placeholder="Ej: Santiago Favre"></div>
    <div class="field">
      <label>Contacto <span class="opt">(cliente)</span></label>
      <input id="fContacto" list="listaContactos" placeholder="Nombre del cliente o selecciona...">
      <datalist id="listaContactos"></datalist>
    </div>
    <div class="field"><label>Teléfono <span class="opt">(opcional)</span></label><input id="fTelefono" inputmode="tel" placeholder="Ej: 2494123456"></div>
    <div class="field"><label>Ubicación <span class="opt">(opcional)</span></label><input id="fUbicacion" placeholder="Dirección"></div>
    <div class="field-toggle">
  <div class="lbl">Notificar al contacto<small>Enviar aviso por WhatsApp</small></div>
  <label class="switch"><input type="checkbox" id="fNotificar"><span class="track"></span><span class="knob"></span></label>
</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" id="btnSave" onclick="enviarCita()">Guardar cita</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
